[package]
name = "display-backends"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Linux userspace display backends over caller-supplied bus and GPIO handles"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
demo = ["dep:embedded-graphics"]

[dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev-uapi = "0.7.0"
spidev = "0.7.1"
embedded-graphics = { version = "0.8.2", optional = true }

[[bin]]
name = "display-backends-demo"
path = "src/bin/display-backends-demo.rs"
required-features = ["demo"]
